[package]
name = "daylight"
version = "0.1.7"
description = "Daylight tray shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "daylight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "daylight"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
jiff = "0.2"
notify-rust = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.5"
tauri-plugin-single-instance = "2.5"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Devices_Geolocation",
] }
