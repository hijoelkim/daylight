name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer and portable exe
        working-directory: desktop
        run: npm run tauri build

      - name: Collect Daylight.exe and Daylight-Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $exe = Get-ChildItem -Path desktop/src-tauri/target/release -Filter *.exe |
            Where-Object { $_.Name -match '^(Daylight|daylight)\.exe$' } |
            Select-Object -First 1
          if (-not $exe) { throw "portable exe missing" }
          Copy-Item $exe.FullName artifacts/Daylight.exe
          $setup = Get-ChildItem -Path desktop/src-tauri/target/release/bundle/nsis -Filter *-setup.exe |
            Select-Object -First 1
          if (-not $setup) { throw "NSIS setup missing" }
          Copy-Item $setup.FullName artifacts/Daylight-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: daylight-windows
          path: |
            artifacts/Daylight.exe
            artifacts/Daylight-Setup.exe

      - name: Attach installers to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Daylight.exe
            artifacts/Daylight-Setup.exe
