name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer and portable exe
        working-directory: desktop
        run: npm run tauri build

      - name: Collect Daylight.exe and Daylight-Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $exe = Get-ChildItem -Path desktop/src-tauri/target/release -Filter *.exe |
            Where-Object { $_.Name -match '^(Daylight|daylight)\.exe$' } |
            Select-Object -First 1
          if (-not $exe) { throw "portable exe missing" }
          Copy-Item $exe.FullName artifacts/Daylight.exe
          $setup = Get-ChildItem -Path desktop/src-tauri/target/release/bundle/nsis -Filter *-setup.exe |
            Select-Object -First 1
          if (-not $setup) { throw "NSIS setup missing" }
          Copy-Item $setup.FullName artifacts/Daylight-Setup.exe

      # Authenticode hook. Do not commit a certificate.
      # When a cert exists, add repo secrets WINDOWS_CERT_BASE64 and WINDOWS_CERT_PASSWORD,
      # install signtool via the Windows SDK, then uncomment this step before the release upload.
      # - name: Sign installers
      #   if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
      #   shell: pwsh
      #   env:
      #     WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      #     WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      #   run: |
      #     $pfx = Join-Path $env:RUNNER_TEMP daylight.pfx
      #     [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
      #     Get-ChildItem artifacts\*.exe | ForEach-Object {
      #       & signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
      #     }
      #     Remove-Item $pfx -Force

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: daylight-windows
          path: |
            artifacts/Daylight.exe
            artifacts/Daylight-Setup.exe

      - name: Attach installers to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Daylight.exe
            artifacts/Daylight-Setup.exe
